# Can a Worker reach MongoDB Atlas at all? The official Node driver over Workers' TCP
# sockets (nodejs_compat), against the prod cluster's public address - with no credentials:
# `hello` is answered before any login. See ../README.md.
name = "tc-proto-mongo"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Public: the cluster's SRV name, as the old C# code has it. No user, no password.
MONGO_URL = "mongodb+srv://dimmik-mongo-4su6a.azure.mongodb.net/?serverSelectionTimeoutMS=8000&connectTimeoutMS=8000"

[observability]
enabled = true
