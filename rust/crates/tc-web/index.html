<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tourcalc</title>
    <!--
        The app's own stylesheet, taken from the Blazor client unchanged. Three and a half
        thousand lines of CSS that know nothing about which framework drew the markup - the
        cheapest part of the port by a distance.
    -->
    <link data-trunk rel="css" href="../../../TCBlazor/Client/wwwroot/css/newui.css" />
    <!--
        And the small interface's own, also taken as it is. It is 141 rules against the
        roomy one's three and a half thousand, which is the whole shape of that screen:
        one line per thing, and the line does the work.
    -->
    <link data-trunk rel="css" href="../../../TCBlazor/Client/wwwroot/css/mini.css" />
    <!--
        wasm-opt needs to be told which wasm features the compiler used; without these it
        refuses the output of a current rustc with "memory.copy operations require bulk
        memory operations".
    -->
    <link data-trunk rel="rust" data-wasm-opt="z"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext" />
    <link data-trunk rel="copy-file" href="sw.js" />

    <!--
        The icon. Drawn here rather than fetched from anywhere: `favicon.svg` is the source,
        and the other two are rendered from it -

            python3 -c "import cairosvg; [cairosvg.svg2png(url='favicon.svg', \
                write_to=f'/tmp/f{n}.png', output_width=n, output_height=n) for n in (48,180)]"
            python3 -c "from PIL import Image; Image.open('/tmp/f48.png').save('favicon.ico', \
                sizes=[(16,16),(32,32),(48,48)])"

        The svg is what a current browser uses; the .ico is for the ones that ask for
        /favicon.ico regardless of what the page says, which is most of them.
    -->
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!--
        This client's own rules. Everything else is the app's stylesheet, taken unchanged -
        which is why these are here and not in it: they are about this build, and editing a
        file two clients share to fix one of them is how the two drift apart.
    -->
    <style>
        /*
            The browser's default 8px body margin, never reset here. It inset the whole app,
            and it made the sticky top bar look broken on a phone: stuck to the top, but 8px
            short of both edges, so the page scrolled past it down either side. The app's own
            page resets this; ours did not.
        */
        body {
            margin: 0;
        }

        /*
            On a narrow screen the bar's buttons take all of it and the tour's name is
            squeezed to nothing - literally nothing: a title box zero pixels wide. The app
            has the same crush and shows three or four letters; that is not better, it is
            just less obviously broken.

            So the name gets a line of its own under the controls. Same elements in the same
            order, one row instead of none, and the name is readable - which is the only
            reason it is up there once the hero has scrolled away.
        */
        @media (max-width: 520px) {
            .tcn-topbar {
                height: auto;
                flex-wrap: wrap;
                padding: 6px 12px 8px;
                row-gap: 2px;
            }

            /*
                Always its own row here, rather than only when it does not fit. Measured
                first: at 412 pixels the buttons and the brand already take 340 of them, so
                "only when it has to" is "always" on a phone, and a bar whose height depends
                on the length of a tour's name jumps as you move between screens. The one
                clever version of this - a `min-content` floor so a short name stays beside
                the buttons - does not work at all: the title is `white-space: nowrap`, so
                its min-content width is the whole string, and a long name pushed itself
                straight out of the bar.
            */
            .tcn-topbar-title {
                order: 3;
                flex: 1 0 100%;
                font-size: 15px;
            }
        }

        /* Narrower still, and the row of controls itself stops fitting: the chip that says
           which build this is goes first, being the one thing on the bar that is not a
           control. The help page says it in full. */
        @media (max-width: 400px) {
            /* Three classes deep on purpose: the app's stylesheet lays out that row with
               `.tcn-topbar-actions > span:not(:empty)`, which outranks a single class, and
               a plain `.tcw-buildchip { display: none }` did nothing at all. */
            .tcn-topbar .tcn-topbar-actions > .tcw-buildchip {
                display: none;
            }
        }
    </style>
</head>
<body>
    <script>
        // Registration is three lines of JavaScript and there is no reason to route it
        // through wasm. It is deliberately not awaited: the app must start whether or not
        // the browser supports service workers.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
