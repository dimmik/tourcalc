<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tourcalc</title>
    <!--
        The app's own stylesheet, taken from the Blazor client unchanged. Three and a half
        thousand lines of CSS that know nothing about which framework drew the markup - the
        cheapest part of the port by a distance.
    -->
    <link data-trunk rel="css" href="../../../TCBlazor/Client/wwwroot/css/newui.css" />
    <!--
        And the small interface's own, also taken as it is. It is 141 rules against the
        roomy one's three and a half thousand, which is the whole shape of that screen:
        one line per thing, and the line does the work.
    -->
    <link data-trunk rel="css" href="../../../TCBlazor/Client/wwwroot/css/mini.css" />
    <!--
        wasm-opt needs to be told which wasm features the compiler used; without these it
        refuses the output of a current rustc with "memory.copy operations require bulk
        memory operations".
    -->
    <link data-trunk rel="rust" data-wasm-opt="z"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext" />
    <link data-trunk rel="copy-file" href="sw.js" />

    <!--
        The icon. Drawn here rather than fetched from anywhere: `favicon.svg` is the source,
        and everything else is rendered from it by `render-icons.py` beside this file.

        The svg is what a current browser uses; the .ico is for the ones that ask for
        /favicon.ico regardless of what the page says, which is most of them.
    -->
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="icon-180.png" />
    <!--
        The app installs on a phone's home screen, and what makes it installable rather than
        a bookmark is the manifest: a name, a colour and two icons. The C# client had one;
        without it "add to home screen" - which people here already use - loses the
        standalone window and puts a screenshot of the page on the desktop instead of an
        icon.
    -->
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link data-trunk rel="copy-file" href="icon-maskable-512.png" />
    <!--
        Under a new name, and the old one kept beside it. A browser that was here while this
        domain served the other client may be holding *its* manifest - one that names icons
        which no longer exist - and until that copy expires the browser decides the app
        cannot be installed and offers a bookmark instead. Nothing can be stale at an
        address that has never been asked for before.
    -->
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link rel="manifest" href="/manifest.webmanifest" data-tcw="page" />
    <!-- The two names that manifest asked for, so that even a stale copy of it works. -->
    <link data-trunk rel="copy-file" href="ms-icon-150x150.png" />
    <link data-trunk rel="copy-file" href="ms-icon-310x310.png" />
    <!--
        The same set again, with a b on it, for the beta build. Nothing here points at it:
        the files keep their names and the server puts this directory in front of the one
        above when it is a beta build, so every address on the page - and in the manifest -
        stays exactly what it is. See `beta_skin` in the server.

        Which means a beta phone installs the app with the beta icon on it, without a second
        manifest and without the page knowing which build it is.
    -->
    <link data-trunk rel="copy-dir" href="beta" />
    <meta name="theme-color" content="#4f46e5" />
    <!--
        iOS reads none of the above. A home-screen icon there opens in Safari, with its
        address bar and its back gesture, unless the page says otherwise - and it says it
        with these, which Apple has never replaced.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tourcalc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!--
        This client's own rules. Everything else is the app's stylesheet, taken unchanged -
        which is why these are here and not in it: they are about this build, and editing a
        file two clients share to fix one of them is how the two drift apart.
    -->
    <style>
        /*
            The base the app's stylesheet is written against and never states, because in the
            other client Bootstrap states it: `newui.css` is loaded there after
            bootstrap.min.css, which resets both of these. Here nothing did.

            Both were real bugs on a phone, and neither was visible on a desktop:

            * the 8px body margin inset the whole app, so the sticky top bar stopped short of
              both edges and the page scrolled past it down either side;
            * without border-box, the search field - `width: 100%` plus 62px of padding, as
              the stylesheet writes it - came out 305 pixels wide inside a 243 pixel box, and
              pushed the whole page sideways. The Compact button went with it, off the edge.
        */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        /*
            On a narrow screen the bar's controls take the whole width and the tour's name
            is squeezed to nothing - literally nothing: a title box zero pixels wide.

            Giving the name its own row worked and looked like what it was: a bar of buttons
            with a caption stuck under it. So the controls go behind one button instead, and
            the bar stays a single line: what you are looking at, and a way to everything
            else. Which is also the honest order - the name is the thing you need to see
            every time, and the interface switch is not.

            The same markup either way. The row of controls becomes the panel: nothing is
            duplicated, nothing can drift between the two.
        */
        .tcw-menu-btn {
            display: none;
        }

        /* Somebody else changed the open tour. Over everything, a form included - that is
           where "what you save goes on top of it" matters - and clear of the + Spend button. */
        .tcw-others {
            position: fixed;
            left: 50%;
            bottom: calc(92px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 1100;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: max-content;
            max-width: min(560px, calc(100vw - 32px));
            padding: 10px 14px;
            border-radius: 12px;
            background: #1e1b4b;
            color: #fff;
            font-size: 14px;
            line-height: 1.35;
            box-shadow: 0 8px 28px rgba(15, 23, 42, .28);
        }
        .tcw-others-waiting {
            margin: 10px 16px 0;
            padding: 8px 12px;
            border-radius: 10px;
            background: #fef3c7;
            color: #78350f;
            border: 1px solid #fcd34d;
            font-size: 13px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .tcw-others-text { overflow-wrap: anywhere; }
        .tcw-others-close {
            flex: none;
            border: 0;
            background: transparent;
            color: inherit;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            opacity: .75;
        }
        .tcw-others-close:hover { opacity: 1; }
        /* The expenses it touched, lit for a moment. */
        .tcw-lit { animation: tcw-lit 4s ease-out; }
        @keyframes tcw-lit {
            0%, 35% { background-color: #fde68a; box-shadow: 0 0 0 2px #f59e0b; }
            100% { background-color: transparent; box-shadow: 0 0 0 0 transparent; }
        }
        @media (prefers-reduced-motion: reduce) {
            .tcw-lit { animation: none; outline: 2px solid #f59e0b; }
        }

        /* The bell on a tour in the list: whether this device is notified about it. After the
           name, not a chip of its own - it is about the reader's device, not the tour.
           Ringing in colour; known not to, crossed out and grey; not found out yet, a faint
           grey bell. */
        .tcw-bell {
            display: inline-block;
            margin-left: .35em;
            font-size: .8em;
            text-decoration: none;
        }
        .tcw-bell.is-off { filter: grayscale(1); opacity: .5; }
        /* The tour's own bell while what is true is not known: dashed, so it does not read
           as the outline of "off". */
        .tcn-bell.is-unknown { border-style: dashed; background: transparent; }
        .tcw-bell.is-unknown { filter: grayscale(1); opacity: .28; }

        /*
            The name in the bar is two different things wearing one set of clothes. On the
            list or in a tour it is a caption - this is what you are looking at. On Help or
            Settings it is the way back to the tour you stepped out of, and a caption is not
            something anybody presses: it has to look like a control, and say which way it
            goes.

            It hugs its text there rather than filling the bar, so the pill is the size of
            the thing it offers; `margin-right: auto` keeps the controls at the far end,
            which the caption's `flex: 1` was doing before.

            The arrow is positioned rather than a flex item, and the box stays the block the
            caption already was: a flex container has no single line of text to trim, so an
            inline-flex pill cut a long tour's name off mid-letter instead of ending it in
            the ellipsis the caption has always had.
        */
        .tcn-topbar-title.tcw-back {
            flex: 0 1 auto;
            margin-right: auto;
            position: relative;
            padding: 3px 11px 3px 21px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .16);
            transition: background .15s ease;
        }

        .tcn-topbar-title.tcw-back::before {
            content: "\2039";
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            line-height: 1;
            opacity: .85;
        }

        .tcn-topbar-title.tcw-back:hover {
            background: rgba(255, 255, 255, .3);
        }

        /*
            A dialog that keeps its head and its feet. The card had no height of its own, so
            a long form - the expense one, with its chips - grew past the screen and took
            Cancel and Save with it: to save, you scrolled. Now the card is a column bounded
            by the viewport, and only the middle of it scrolls.

            `dvh` rather than `vh` because on a phone the browser's own bar comes and goes,
            and `vh` is the tall version of the window: a footer positioned against it sits
            below the fold exactly when the bar is showing. The `vh` line stays first for
            anything that does not know `dvh`.
        */
        .tcn-modal-card {
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 48px);
            max-height: calc(100dvh - 48px);
        }

        .tcn-modal-body {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tcn-modal-head,
        .tcn-modal-foot {
            flex: 0 0 auto;
        }

        /* Errors sit above the two buttons, so the row has to be able to wrap. */
        .tcn-modal-foot {
            flex-wrap: wrap;
        }

        /* The screen before the app's own screen. Deliberately plain: it is either seen
           for a quarter of a second or it is the bad news, and neither wants decoration. */
        .tcw-boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 70dvh;
            padding: 24px;
            text-align: center;
            color: #475569;
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .tcw-boot-name {
            font-size: 19px;
            font-weight: 700;
            color: #1f2937;
            letter-spacing: -.01em;
        }

        .tcw-boot-line { max-width: 34em; }

        #tcw-boot-again {
            margin-top: 6px;
            padding: 9px 18px;
            border-radius: 10px;
            border: 1px solid #c7cbd4;
            background: #fff;
            font: inherit;
            font-weight: 600;
            color: #1f2937;
            cursor: pointer;
        }

        /* A row the calculator wrote for itself is not an expense, and the app paints it:
           green for a payback, cyan for a transfer inside a family. Those rules are written
           for `.tcn-sp`, and these rows are `.tcn-settle`, so the colours are repeated here
           against the class the rows actually carry - the variables are the app's own.

           The stripe is an inset shadow rather than a left border because a hand-picked
           colour paints `border-color` inline, and the app is careful to keep the stripe
           under a mark: the mark says "read this line", the stripe says what kind of line
           it is, and they are answers to different questions. */
        .tcw-payback {
            --tcw-kind: #10b981;
            --tcw-kind-soft: var(--tcn-green-soft);
        }

        .tcw-family {
            --tcw-kind: #06b6d4;
            --tcw-kind-soft: var(--tcn-cyan-soft);
        }

        .tcn-settle.tcw-kind {
            background: var(--tcw-kind-soft);
            box-shadow: inset 4px 0 0 var(--tcw-kind), var(--tcn-shadow);
            padding-left: 16px;
        }

        /* The dense list says it in the gutter: mini.css only dims those rows, and dim is
           what a draft looks like there, so the colour is what tells them apart. */
        .tcm-item.tcw-kind > .tcm-row {
            background: var(--tcw-kind-soft);
            box-shadow: inset 3px 0 0 var(--tcw-kind);
        }

        /* The ring on the statistics tab. Bigger where there is room: beside a list on a
           wide screen it can afford to be, and on a phone it is sharing the width. */
        .tcw-ring {
            width: 150px;
            height: 150px;
        }

        @media (min-width: 560px) {
            .tcw-ring {
                width: 190px;
                height: 190px;
            }
        }

        @media (max-width: 560px) {
            .tcw-menu-btn {
                display: inline-flex;
            }

            .tcn-topbar .tcn-topbar-actions {
                display: none;
                position: absolute;
                top: 48px;
                right: 8px;
                z-index: 50;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                min-width: 190px;
                padding: 10px;
                border-radius: 14px;
                /* The same colour as the bar it hangs from: the buttons inside it are white
                   on translucent white, and on a pale panel they would be invisible. */
                background: var(--tcn-primary-dark, var(--tcn-primary));
                box-shadow: 0 12px 30px rgba(15, 23, 42, .35);
            }

            .tcn-topbar .tcn-topbar-actions.tcw-open {
                display: flex;
            }

            /* In a menu an icon on its own is a riddle. The labels are already there, in the
               aria-label every one of these carries for a screen reader. */
            .tcn-topbar-actions.tcw-open .tcn-iconbtn {
                width: auto;
                justify-content: flex-start;
                gap: 10px;
                padding: 8px 10px;
                font-size: 14px;
            }

            .tcn-topbar-actions.tcw-open .tcn-iconbtn::after {
                content: attr(aria-label);
            }

            .tcn-topbar-actions.tcw-open .tcn-uiswitch {
                justify-content: center;
            }

            .tcw-menu-backdrop {
                position: fixed;
                inset: 0;
                z-index: 45;
            }
        }

    </style>
</head>
<body>
    <!--
        What is on screen before the app is - which, until now, was nothing at all.
        Leptos mounts into this body; everything above it is script. So a client that
        does not start leaves a white page with no word on it and no way out but a
        reload somebody has to think of, and on a phone that is exactly what happens:
        the browser drops a tab that has been in the background for half an hour, comes
        back to it, and asks for a megabyte of WebAssembly over a radio that is still
        asleep. The fetch fails, nothing mounts, and the page is blank for good.

        The app removes this the moment it is up (see `tcw_started` in main.rs).
    -->
    <div id="tcw-boot" class="tcw-boot">
        <div class="tcw-boot-name">Tourcalc</div>
        <div class="tcw-boot-line" id="tcw-boot-why">Starting…</div>
        <button type="button" id="tcw-boot-again" hidden>Try again</button>
    </div>

    <script>
        // Making sure the page points at its manifest, because it turns out that cannot be
        // taken for granted. On a reader's phone the tag was simply not in the document -
        // the server sends it, the same check from elsewhere finds it, the manifest file
        // itself downloads perfectly well from that very phone - so something on the device
        // takes it out: a content blocker, a filtering VPN, a privacy app. Whatever it is,
        // a browser only reads a manifest the page points at, so without the tag the app
        // cannot be installed and nothing says why.
        //
        // Putting it back costs nothing where it was never taken away. Checked three times
        // rather than watched continuously: at parse, when the document is ready and when
        // everything has loaded, which is where anything that edits the page has done its
        // work - and three fixed moments cannot turn into a fight with it.
        (function () {
            const ensure = () => {
                if (document.querySelector('link[rel=manifest]')) return;
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = '/manifest.webmanifest';
                document.head.appendChild(link);
            };
            ensure();
            document.addEventListener('DOMContentLoaded', ensure);
            window.addEventListener('load', ensure);
        })();

        // Catching the browser's offer to install the app, which has to happen here rather
        // than in the app: the event fires once, early, and is gone - usually before a
        // megabyte of wasm has finished compiling. Held until somebody asks for it in
        // Settings, which is the only place that offers it.
        window.tcwInstall = null;
        window.addEventListener('beforeinstallprompt', (event) => {
            // Without this the browser puts its own bar on the page, which is its way of
            // asking and not ours.
            event.preventDefault();
            window.tcwInstall = event;
        });
        // And the browser says when it is done - which may be from its own menu, without
        // this page being asked at all. The tab it happened in is still a tab, so nothing
        // else would notice.
        window.tcwInstalled = false;
        window.addEventListener('appinstalled', () => {
            window.tcwInstall = null;
            window.tcwInstalled = true;
        });

        // Registration is three lines of JavaScript and there is no reason to route it
        // through wasm. It is deliberately not awaited: the app must start whether or not
        // the browser supports service workers.
        // Noticing that the app never started, and saying so.
        //
        // Three ways to find out, because they fail at different moments: the module
        // itself refusing to load, the promise inside it rejecting, and - the catch-all
        // for everything unforeseen - it simply not being up after nine seconds. Only
        // the first two are quick; the timer is there so that no failure ends as a
        // white page.
        (function () {
            const boot = document.getElementById('tcw-boot');
            const why = document.getElementById('tcw-boot-why');
            const again = document.getElementById('tcw-boot-again');
            const up = () => window.tcwStarted === true;
            let told = false;

            const tell = () => {
                if (up() || told || !boot) return;
                told = true;
                why.textContent = 'Tourcalc did not start. It may have been asked for while ' +
                    'this device had no connection.';
                again.hidden = false;
            };

            again.addEventListener('click', () => location.reload());
            setTimeout(tell, 9000);
            // A script that fails to load reports it on the element, which only a
            // listener in the capture phase sees.
            window.addEventListener('error', (event) => {
                if (event.target && event.target.tagName === 'SCRIPT') tell();
            }, true);
            window.addEventListener('unhandledrejection', tell);

            // And the one that fixes the case above by itself: coming back to a tab the
            // browser emptied while we were away. If the app is not up by the time the
            // page is looked at again, start it over - once a minute at the most, so a
            // client that genuinely cannot start does not sit there reloading itself.
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible' || up()) return;
                try {
                    const last = Number(sessionStorage.getItem('tcw-reboot') || 0);
                    if (Date.now() - last < 60000) return;
                    sessionStorage.setItem('tcw-reboot', String(Date.now()));
                } catch (e) { /* a browser with no session storage still gets one go */ }
                location.reload();
            });
        })();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</body>
</html>
