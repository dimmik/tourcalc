<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Tourcalc">
    <!--
        What the app does, in one glyph: it divides. A rounded tile in the default accent
        with a division sign on it - a bar and two dots, which is about as much as survives
        at sixteen pixels, and reads there as nothing else.

        Deliberately not the old icon, which is a green tick: the two builds sit in
        neighbouring tabs and have to be told apart at a glance.
    -->
    <rect width="64" height="64" rx="15" fill="#4f46e5"/>
    <circle cx="32" cy="18" r="6.5" fill="#fff"/>
    <rect x="12" y="28.5" width="40" height="7" rx="3.5" fill="#fff"/>
    <circle cx="32" cy="46" r="6.5" fill="#fff"/>
</svg>
