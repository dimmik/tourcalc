[package]
name = "tc-web"
version = "0.1.0"
edition = "2021"

[dependencies]
tc-core = { path = "../tc-core" }

leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Storage", "History", "Navigator",
    # Push notifications: the browser's own subscription machinery.
    "ServiceWorker", "ServiceWorkerContainer", "ServiceWorkerRegistration",
    "PushManager", "PushSubscription", "PushSubscriptionOptionsInit", "PushSubscriptionJson",
    # Copying a tour to the clipboard, with the old textarea trick as the fallback.
    "Clipboard", "Document", "HtmlDocument", "HtmlTextAreaElement", "Element",
] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
