<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Tourcalc">
    <!--
        The same tile for a launcher that will cut it to whatever shape it likes: square,
        circle, squircle. No rounded corners of our own - the mask does that, and a rounded
        tile inside a rounded mask reads as a mistake - and nothing to keep clear of the
        edges, because the design has no middle to protect. Whatever is cropped, the cut
        survives.
    -->
    <rect width="64" height="64" fill="#1f3bff"/>
    <path d="M64,0 V64 L14,64 Z" fill="#a3ff12"/>
    <path d="M10,68 L68,-4" stroke="#fff" stroke-width="3.6" fill="none"/>
</svg>
