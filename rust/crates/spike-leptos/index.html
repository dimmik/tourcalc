<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tourcalc — Rust spike</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; background: #f1f4f9; color: #111827; }
    .top { display:flex; gap:8px; align-items:center; padding:10px 14px; background:#4f46e5; color:#fff; }
    .stats { display:flex; gap:18px; padding:10px 14px; }
    .tabs { display:flex; gap:6px; padding:0 14px 10px; }

    .tabs button.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
    .list { list-style:none; margin:0; padding:0 14px 24px; }
    .list li { display:flex; gap:10px; align-items:baseline; justify-content:space-between;
               background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:8px 12px; margin-bottom:6px; }
    .list small { color:#6b7280; margin-left:auto; margin-right:10px; }
