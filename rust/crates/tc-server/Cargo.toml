[package]
name = "tc-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tc-core = { path = "../tc-core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-br", "compression-gzip", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure Rust, on purpose: the C# server drags in BouncyCastle for one SecureRandom and one
# BigInteger, and anything linking system OpenSSL would need packages to be installed.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"

# The text pages: reading posted forms, and putting a code into a URL.
form_urlencoded = "1"

# The store is behind a trait and the driver is asynchronous, so the trait has to be too.
# `dyn TourStore` is what the server holds, and a plain `async fn` in a trait is not yet
# usable through `dyn` - this crate does the boxing that makes it work.
async-trait = "0.1"

# MongoDB, and it is optional on purpose. The driver refuses to build without a TLS backend
# ("At least one of the features 'rustls-tls', 'rustls-tls-aws-lc' or 'openssl-tls' must be
# enabled"), and every one of those brings C or assembly with it - which is exactly what
# this build's cross-compilation is free of. So the default build has no database and the
# image stays as it is; `--features mongo` turns it on for whoever needs it.
mongodb = { version = "3", optional = true }

# Sending a push notification. Optional for the same reason as MongoDB: reaching a push
# service means outbound HTTPS, which means a TLS stack, which means C. Storing the
# subscriptions and answering the endpoints needs none of that and is always built.
web-push-native = { version = "0.5", optional = true }
http = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
bson = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
# Storage in MongoDB. Costs the pure-Rust build - see the note by the dependency.
mongo = ["dep:mongodb", "dep:bson", "dep:futures-util"]
# Actually delivering push notifications. Without it they are stored, counted and logged.
push = ["dep:web-push-native", "dep:http", "dep:reqwest"]
