[package]
name = "tc-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tc-core = { path = "../tc-core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-br", "compression-gzip", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure Rust, on purpose: the C# server drags in BouncyCastle for one SecureRandom and one
# BigInteger, and anything linking system OpenSSL would need packages to be installed.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"

# The text pages: reading posted forms, and putting a code into a URL.
form_urlencoded = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
