name: Rust image (shared steps)
# Not run by itself: `rust-prod.yml` and `rust-beta.yml` call it, one per kind of build.
#
# Two callers rather than one workflow with a branch check, for the sake of whoever reads
# the notifications. GitHub names a run after the workflow, and the branch comes last in the
# subject of its e-mail - "Run failed: Rust -- Create and publish a Docker image -
# beta/workflows (1c55d08)" - where a mail client's preview has already cut it off. With a
# caller per kind the subject starts "PROD" or "BETA". The steps stay here, in one place.

on:
  workflow_call:
    inputs:
      kind:
        description: "prod or beta: which tags to publish, and what the build calls itself"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: ${{ inputs.kind }} image
    runs-on: ubuntu-latest
    # No more than the caller grants; both callers grant exactly this.
    permissions:
      contents: read
      packages: write

    # A database for the tests of the MongoDB store - the only ones that check the documents
    # this server writes are the documents the C# reads. Without it they skip themselves,
    # which is what they did here until now: passing, and proving nothing.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: YYYYMMDD-HHmmss
          utcOffset: "+03:00"

      # Which image this run is publishing, as the caller said.
      #
      # The names say *which* image and never what it is made of: prod publishes plain
      # `latest`, beta publishes `beta-latest`. A deployment follows one of those two names
      # for good - the day the thing behind it is rewritten in something else again, nothing
      # on any server has to be edited. Which implementation it actually is stays visible
      # where it belongs: `BUILD_TYPE`, which the build page and the version header print.
      - name: Work out which image this is
        id: kind
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
        run: |
          case "$KIND" in
            prod)
              echo "moving=latest"      >> $GITHUB_OUTPUT
              echo "dated=prod"         >> $GITHUB_OUTPUT
              echo "type=prodR"         >> $GITHUB_OUTPUT ;;
            beta)
              echo "moving=beta-latest" >> $GITHUB_OUTPUT
              echo "dated=beta"         >> $GITHUB_OUTPUT
              echo "type=betaR"         >> $GITHUB_OUTPUT ;;
            *)
              echo "kind must be prod or beta, not '$KIND'" >&2; exit 1 ;;
          esac

      # No QEMU: the server is cross-compiled and the wasm is architecture-independent, so
      # nothing in this build ever runs emulated. See the comments in tourcalc.rust.docker.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//\\\//g')" >> $GITHUB_OUTPUT
        id: extract_branch

      # The tests are the reason to trust the image; the image itself takes seven or eight
      # minutes, so they are the cheap half of the build. The database ones included: the
      # job has a mongod of its own, above.
      # The tests compile the whole workspace, and on a fresh runner that means six hundred
      # crates from nothing every time. This keeps cargo's registry and the test build
      # between runs, keyed on Cargo.lock: unchanged dependencies are restored rather than
      # rebuilt. It is a separate cache from the image's - that one is Docker layers, and
      # this job is not building an image.
      - name: Cache the test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        env:
          TC_TEST_MONGO: mongodb://127.0.0.1:27017
        run: |
          cd rust
          cargo test --locked --workspace

      - name: linux/amd64,linux/arm64 Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: tourcalc.rust.docker
          push: true
          # The moving tag is what a deployment follows; the dated one is what it can be
          # rolled back to, and what the build page names.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.kind.outputs.moving }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.kind.outputs.dated }}-${{ steps.current-time.outputs.formattedTime }}
          build-args: |
             BUILD_TYPE=${{ steps.kind.outputs.type }} (${{ steps.extract_branch.outputs.branch }})
             BUILD_ID=${{ steps.current-time.outputs.formattedTime }}
             BUILD_COMMIT=${{ github.sha }}
          # Rust compiles the world on a cold start; without this every push pays for it
          # again. `mode=max` keeps the intermediate stages too, which is where the time is.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: io.containers.autoupdate=registry
