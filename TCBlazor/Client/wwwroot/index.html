<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        function BlazorScrollToId(id) {
            const element = document.getElementById(id);
            if (element instanceof HTMLElement) {
                element.scrollIntoView({
                    behavior: "smooth",
                    block: "start",
                    inline: "nearest"
                });
            }
        }
        function backToTop() {
            document.getElementById("app").scrollIntoView();
        }
        window.clipboardCopy = {
            copyText: function (text) {
                navigator.clipboard.writeText(text).then(function () {
                    alert("Copied to clipboard!");
                })
                    .catch(function (error) {
                        alert(error);
                    });
            }
        };

        // cookies
        function setCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }
        function eraseCookie(name) {
            document.cookie = name + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }
        // /cookies
        // window size
        window.getDimensions = function () {
            return {
                width: window.innerWidth,
                height: window.innerHeight
            };
        };
        // /window size
        // resize
        window.browserResize = {
            registerResizeCallback: function () {
                //alert("registered");
                window.addEventListener("resize", browserResize.resized);
            },
            resized: function () {
                DotNet.invokeMethodAsync("TCBlazor.Client", 'OnBrowserResize').then(data => data);
            }
        }
        window.browserResize.registerResizeCallback();
        // /resize

        // pushNotifications
        (function () {
            // Note: Replace with your own key pair before deploying
            //const applicationServerPublicKey = 'BLZ-598ZLl7rRa98qQcQicg2E4OOBUDIZUt14ZANf6HTGMKVm-2bYuL00JQjC1Hicio7P1kpnIC4SuPfrnKLJeI';
            //alert("key: " + applicationServerPublicKey)
            window.blazorPushNotifications = {
                requestSubscription: async (applicationServerPublicKey) => {
                    //alert("pkey: " + applicationServerPublicKey);
                    const worker = await navigator.serviceWorker.getRegistration();
                    const existingSubscription = await worker.pushManager.getSubscription();
                    if (!existingSubscription) {
                        const newSubscription = await subscribe(worker, applicationServerPublicKey);
                        if (newSubscription) {
                            return {
                                url: newSubscription.endpoint,
                                p256dh: arrayBufferToBase64(newSubscription.getKey('p256dh')),
                                auth: arrayBufferToBase64(newSubscription.getKey('auth'))
                            };
                        }
                    } else {
                        return {
                            url: existingSubscription.endpoint,
                            p256dh: arrayBufferToBase64(existingSubscription.getKey('p256dh')),
                            auth: arrayBufferToBase64(existingSubscription.getKey('auth'))
                        };
                    }
                }
            };

            async function subscribe(worker, applicationServerPublicKey) {
                try {
                    return await worker.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: applicationServerPublicKey
                    });
                } catch (error) {
                    if (error.name === 'NotAllowedError') {
                        return null;
                    }
                    throw error;
                }
            }

            function arrayBufferToBase64(buffer) {
                // https://stackoverflow.com/a/9458996
                var binary = '';
                var bytes = new Uint8Array(buffer);
                var len = bytes.byteLength;
                for (var i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return window.btoa(binary);
            }
            window.checkNotificationAllowed = () => {
                return Notification.permission == 'granted';
            }

        })();
        // / pushNotifications

    </script>
    <style>
        /* Use a more specific selector if possible */
        *[id] {
            scroll-margin-top: 1rem;
        }
        /* less fat menu */
        div .ant-menu-submenu-title {
            height: 16px !important;
            line-height: 16px !important;
            padding: 0px 8px 0px 4px !important;
            margin: 1px 0px 1px 0px !important;
        }

        .ant-menu-submenu-arrow {
            right: 8px !important;
            width: 3px !important;
        }
        /*div-based table*/
        .grid-table {
            display: grid;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        /*designated row - for selectors. Does not count as a cell*/
        .grid-table .row {
            display: contents;
        }
        /*highlight a bit even rows*/
        .row:nth-child(odd) div {
            opacity: 1;
        }
        .row:nth-child(even) div {
            opacity: 0.85;
        }
        /*cells*/
        .grid-header {
            background-color: #ffffff;
            color: black;
            padding: 3px;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }
        .grid-cell {
            background-color: white;
            padding: 2px;
            text-align: left;
            border-right: 1px dotted green;
        }
        .center {
            text-align: center;
        }
        .grid-cell-span-all-cols {
            grid-column: 1 / -1;
            text-align: center;
        }
        .grid-cell-no-data {
            grid-column: 1 / -1;
            text-align: center;
            font-style: italic;
            background-color: lightgray;
        }
        .balance {
            text-align: right;
            font-weight: bold;
        }
        .compact {
            font-size: x-small
        }

        /*For grouping persons*/
        .family-even-row {
            background-color: #f0f8ff;
        }
        .family-odd-row {
            background-color: #f0fff0;
        }
        .top-thick-border {
            border-top: 2px solid black;
        }
        .left-thick-border {
            border-left: 2px solid black;
        }
        .bottom-thick-border {
            border-bottom: 2px solid black;
        }
        .top-left-round {
            border-top-left-radius: 10px;
        }
        .bottom-left-round {
            border-bottom-left-radius: 10px;
        }

        /*For spending list*/
        .family {
            background-color: aquamarine;
        }
        .planned {
            background-color: yellow;
        }
        .dry-run {
            background-color: bisque;
        }
        .payback {
            background-color: #e8f8f5;
        }
        .family-payback {
            background-color: #fef9e7;
        }

        /*For balance sheet*/
        .Pleasure {
            background-color: lightgreen;
            color: green;
        }
        .Bankrupt {
            background-color: lightpink;
            color: red;
        }
        .JustOk {
            color: black;
        }
        /*For spent or received*/
        .s-to-all {
            /* nothing */
        }
        .s-partial {
            background-color: lightblue;
        }
        .s-personal {
            background-color: lightgreen;
        }
    </style>
